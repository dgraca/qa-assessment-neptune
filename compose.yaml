services:
  neptune-init:
    image: busybox:1.37
    user: root
    command: ["sh", "-c", "chown -R 1000:1000 /home/planet9/db"]
    volumes:
      - neptune-data:/home/planet9/db

  neptune:
    image: neptunesoftware/planet9:v24.15.0
    platform: linux/amd64
    ports:
      - "8080:8080"
    environment:
      PLANET9_IP: 0.0.0.0
      INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - neptune-data:/home/planet9/db
    depends_on:
      neptune-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://localhost:8080/ > /dev/null"
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  playwright:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tests
    environment:
      BASE_URL: http://neptune:8080
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      neptune:
        condition: service_healthy

volumes:
  neptune-data: